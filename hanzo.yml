# Canonical CI/CD config for hanzoai/sharp — read by hanzoai/ci (via
# .hanzo/workflows/cicd.yml) and by platform.hanzo.ai.
#
# Library (npm). The gate is the unit suite over lib/ — the JS API surface,
# resize/composite/metadata pipelines, run against the real libvips binding.
#
# Stated plainly so the coverage is not mistaken for more than it is: `npm
# install` resolves the prebuilt @img/sharp-linux-x64 binding, so this gates the
# JavaScript, not the C++ in src/. Compiling src/ needs a libvips-dev toolchain
# the runner does not carry; the day that matters, it belongs in a Dockerfile
# where the toolchain lives, not in a runner gate that would go red for want of
# a header.
test:
  - name: unit
    run: npm install --no-audit --no-fund && npm run test-unit
